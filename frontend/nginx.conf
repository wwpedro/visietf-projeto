server {
    listen 80;
    server_name localhost;

    # 1. Serve os arquivos estáticos do React
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Redireciona chamadas de API para o container do back-end
    # Tudo que começar com /api/ vai para o back-end (tirando o /api/ do caminho)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}